<!DOCTYPE html><html class=''>
<head>
    <meta charset='UTF-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Experiment</title>

<link rel='stylesheet' type='text/css' href='jspsych.css'>
<link rel='stylesheet' type='text/css' href='default_style.css'>
<link rel='stylesheet' type='text/css' href='style.css'>
</head>

<body>
<script src='js/jquery.min.js'></script>
<script src='js/math.min.js'></script>
<script src='js/jspsych/jspsych.js'></script>
<script src='js/jspsych/plugins/jspsych-text.js'></script>
<script src='js/jspsych/poldrack_plugins/jspsych-poldrack-text.js'></script>
<script src='js/jspsych/poldrack_plugins/jspsych-poldrack-instructions.js'></script>
<script src='js/jspsych/plugins/jspsych-call-function.js'></script>
<script src='js/jspsych/poldrack_plugins/jspsych-attention-check.js'></script>
<script src='js/jspsych/poldrack_plugins/jspsych-poldrack-single-stim.js'></script>
<script src='js/jspsych/plugins/jspsych-survey-text.js'></script>
<script src='js/jspsych/poldrack_plugins/jspsych-single-stim-button.js'></script>
<script src='js/jspsych/poldrack_plugins/poldrack_utils.js'></script>
<script>
// Position of this task in the chained sequence: 0 = first game, 1 = second game.
var CHAIN_INDEX = parseInt(new URLSearchParams(window.location.search).get('i') || '0', 10);

// Participant ID entered by the experimenter on the launcher page. It arrives on the
// query string; localStorage is a fallback in case the URL is ever stripped. Empty
// string when a task is opened standalone, outside the launcher.
var PARTICIPANT_ID = (function() {
    var pid = new URLSearchParams(window.location.search).get('cct_pid');
    if (pid === null) {
        try { pid = localStorage.getItem('cct_pid'); } catch (e) { pid = null; }
    }
    return (pid || '').trim();
})();
</script>
<script src='experiment.js'></script>

<script>
function downloadCSV(filename, csvText) {
    var blob = new Blob([csvText], {type: 'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function timestamp() {
    // Local time, formatted YYYY-MM-DD-HHMM (e.g. 2026-08-31-1654).
    var d = new Date();
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
        + '-' + pad(d.getHours()) + pad(d.getMinutes());
}

function pidPrefix() {
    // Participant ID as a leading file-name fragment, so files group by participant.
    // Spaces become hyphens; an empty ID (standalone run) yields no prefix at all.
    if (!PARTICIPANT_ID) return '';
    return PARTICIPANT_ID.replace(/\s+/g, '-') + '_';
}

function saveResultsCSV(filename) {
    downloadCSV(filename, cctBuildCSV());
}

var IN_CHAINED_MODE = new URLSearchParams(window.location.search).has('s');

$( document ).ready(function() {

    // The CSV export takes participant_id from the event log; this keeps it on
    // jsPsych's own trial data too, which the standalone /save path posts as JSON.
    jsPsych.data.addProperties({ participant_id: PARTICIPANT_ID });

    jsPsych.init({
             timeline: columbia_card_task_hot_experiment,
             display_element: "getDisplayElement",
             fullscreen: !IN_CHAINED_MODE,
             on_trial_start: cctTrialStart,
             on_trial_finish: function(data){
               addID('columbia-card-task-hot')
               cctTrialFinish(data)
             },

             on_finish: function(data){

                 var params = new URLSearchParams(window.location.search);
                 var order = params.get('s');
                 var idx = parseInt(params.get('i') || '0', 10);

                 if (order) {
                     // Chained mode: stash CSV; download all files only after the final task.
                     var orderArr = order.split(',');
                     var roundLabel = (idx === 0) ? 'FirstRound' : 'SecondRound';
                     var filename = pidPrefix() + roundLabel + '_Hot_' + timestamp() + '.csv';
                     try {
                         localStorage.setItem('e_csv_' + idx, cctBuildCSV());
                         localStorage.setItem('e_name_' + idx, filename);
                     } catch (e) {}

                     if (idx + 1 < orderArr.length) {
                         window.location.href = '../task-' + orderArr[idx + 1]
                             + '/index.html?s=' + encodeURIComponent(order)
                             + '&i=' + (idx + 1)
                             + '&cct_pid=' + encodeURIComponent(PARTICIPANT_ID);
                     } else {
                         // Final task: hand off to launcher, which builds and downloads the zip.
                         window.location.href = '../index.html?d=1';
                     }
                     return;
                 }

                 // Standalone mode: original behavior (server save with local fallback).
                 var promise = new Promise(function(resolve, reject) {
                     var d = jsPsych.data.dataAsJSON();
                     resolve(d);
                 });
                 promise.then(function(data) {
                     $.ajax({
                         type: "POST",
                         url: '/save',
                         data: { "data": data },
                         success: function(){ document.location = "/next"; },
                         dataType: "application/json",
                         error: function(err) {
                             if (err.status == 200) {
                                 document.location = "/next";
                             } else {
                                 saveResultsCSV(pidPrefix() + 'columbia-card-task-hot_results_' + timestamp() + '.csv');
                             }
                         }
                     });
                 });
             }

      });
});
</script>
</body>
</html>
