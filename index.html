<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font-family: sans-serif; }
  /* min-height, not height: the panel grows with its content and the page scrolls. */
  #intro, #thanks { display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; text-align: center; padding: 24px 20px; box-sizing: border-box; }
  #intro p, #thanks p { max-width: 560px; color: #333; }
  button.primary {
    font-size: 18px; padding: 12px 28px; cursor: pointer;
    border: none; border-radius: 6px; background: #2563eb; color: #fff;
  }
  button.primary:hover:enabled { background: #1d4ed8; }
  button.primary:disabled { background: #cbd5e1; color: #64748b; cursor: not-allowed; }
  #code-form, #pid-form { margin: 8px 0 4px; }
  #code-form label, #pid-form label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; }
  #code-form input, #pid-form input {
    font-size: 18px; padding: 10px 12px; width: min(200px, 60vw); text-align: center;
    border: 1px solid #cbd5e1; border-radius: 6px; letter-spacing: 2px;
  }
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 3px solid #1d4ed8; outline-offset: 2px;
  }
  #code-form input:disabled, #pid-form input:disabled { background: #f1f5f9; color: #94a3b8; }
  #code-form button, #pid-form button {
    font-size: 16px; padding: 10px 20px; margin-left: 8px; cursor: pointer;
    border: none; border-radius: 6px; background: #475569; color: #fff;
  }
  #code-form button:disabled, #pid-form button:disabled { background: #cbd5e1; color: #64748b; cursor: not-allowed; }
  #code-msg, #pid-msg { min-height: 22px; font-size: 15px; margin: 4px 0 12px; }
  #code-msg.ok, #pid-msg.ok { color: #15803d; }
  #code-msg.err, #pid-msg.err { color: #b91c1c; }
  iframe#exp { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #fff; }
</style>
</head>
<body>

<div id="intro">
  <h1 style="font-weight:normal;">Experiment</h1>
  <p>You will complete two short tasks back-to-back. The experiment will run in fullscreen.</p>
  <div id="step-code">
    <form id="code-form" autocomplete="off">
      <label for="code">Experimenter code</label>
      <input type="password" id="code" name="code" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" inputmode="text">
      <button type="submit" id="unlock">Unlock</button>
    </form>
    <p id="code-msg" role="status" aria-live="polite"></p>
  </div>

  <div id="step-pid" style="display:none;">
    <form id="pid-form" autocomplete="off">
      <label for="pid">Participant ID</label>
      <input type="text" id="pid" name="pid" autocomplete="off" autocapitalize="characters"
             autocorrect="off" spellcheck="false" inputmode="text" maxlength="32">
      <button type="submit" id="setpid">Confirm</button>
    </form>
    <p id="pid-msg" role="status" aria-live="polite"></p>
  </div>

  <p><button class="primary" id="start" disabled>Launch Experiment</button></p>
</div>

<div id="thanks" style="display:none;">
  <h1 style="font-weight:normal;">Experiment Complete</h1>
  <p>You have finished both card games.</p>
  <p>Please let the experimenter know that you are finished.</p>
</div>

<script>
// ---------- Minimal ZIP writer (store / no compression) ----------
function crc32(bytes) {
  var table = crc32.table;
  if (!table) {
    table = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
    crc32.table = table;
  }
  var crc = 0xFFFFFFFF;
  for (var i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ table[(crc ^ bytes[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function buildZip(files) {
  var enc = new TextEncoder();
  var now = new Date();
  var dosTime = ((now.getHours() & 0x1F) << 11) | ((now.getMinutes() & 0x3F) << 5) | (Math.floor(now.getSeconds() / 2) & 0x1F);
  var dosDate = (((now.getFullYear() - 1980) & 0x7F) << 9) | (((now.getMonth() + 1) & 0x0F) << 5) | (now.getDate() & 0x1F);

  var locals = [];
  var centrals = [];
  var offset = 0;

  files.forEach(function(f) {
    var nameBytes = enc.encode(f.name);
    var crc = crc32(f.data);
    var size = f.data.length;

    var lh = new Uint8Array(30 + nameBytes.length + size);
    var dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, dosTime, true);
    dv.setUint16(12, dosDate, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, size, true);
    dv.setUint32(22, size, true);
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);
    lh.set(nameBytes, 30);
    lh.set(f.data, 30 + nameBytes.length);
    locals.push(lh);

    var cd = new Uint8Array(46 + nameBytes.length);
    var cdv = new DataView(cd.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, dosTime, true);
    cdv.setUint16(14, dosDate, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, size, true);
    cdv.setUint32(24, size, true);
    cdv.setUint16(28, nameBytes.length, true);
    cdv.setUint16(30, 0, true);
    cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true);
    cdv.setUint16(36, 0, true);
    cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    cd.set(nameBytes, 46);
    centrals.push(cd);

    offset += lh.length;
  });

  var cdSize = centrals.reduce(function(s, c) { return s + c.length; }, 0);
  var cdOffset = offset;

  var eocd = new Uint8Array(22);
  var edv = new DataView(eocd.buffer);
  edv.setUint32(0, 0x06054b50, true);
  edv.setUint16(4, 0, true);
  edv.setUint16(6, 0, true);
  edv.setUint16(8, files.length, true);
  edv.setUint16(10, files.length, true);
  edv.setUint32(12, cdSize, true);
  edv.setUint32(16, cdOffset, true);
  edv.setUint16(20, 0, true);

  return new Blob(locals.concat(centrals).concat([eocd]), {type: 'application/zip'});
}

function downloadBlob(filename, blob) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

function clearStash() {
  for (var i = 0; i < 10; i++) {
    localStorage.removeItem('e_csv_' + i);
    localStorage.removeItem('e_name_' + i);
  }
  localStorage.removeItem('cct_pid');
}

function exitFullscreen() {
  if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement) {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
  }
}

function finishExperiment() {
  var enc = new TextEncoder();
  var files = [];
  for (var i = 0; i < 10; i++) {
    var csv = localStorage.getItem('e_csv_' + i);
    var name = localStorage.getItem('e_name_' + i);
    if (csv && name) files.push({ name: name, data: enc.encode(csv) });
  }
  clearStash();
  if (files.length > 0) {
    downloadBlob('Results.zip', buildZip(files));
  }
  exitFullscreen();
  document.getElementById('intro').style.display = 'none';
  var iframe = document.getElementById('exp');
  if (iframe) iframe.remove();
  document.getElementById('thanks').style.display = 'flex';
}

// ---------- Experimenter codes ----------
// EDIT THESE to change the codes. Each code maps to a task order:
//   'a' = task-a = Columbia Card Task, HOT version
//   'b' = task-b = Columbia Card Task, COLD version
// Codes are compared lower-cased and trimmed, so capitalisation does not matter.
var CODES = {
  'heron7': ['a', 'b'],   // Hot first, then Cold
  'cedar3': ['b', 'a']    // Cold first, then Hot
};


// ---------- Main ----------
(function() {
  var params = new URLSearchParams(window.location.search);

  // Final stop: the last task redirected back here with d=1.
  if (params.get('d') === '1') {
    if (window.parent && window.parent !== window) {
      try { window.parent.postMessage('exp_done', '*'); } catch (e) {}
      document.body.innerHTML = '';
    } else {
      document.getElementById('intro').style.display = 'none';
      finishExperiment();
    }
    return;
  }

  // Fresh launch: clear stash, wait for a valid experimenter code.
  clearStash();

  var order = null;           // set only once a recognised code is entered
  var participantId = null;   // set only once a participant ID is confirmed
  var form = document.getElementById('code-form');
  var input = document.getElementById('code');
  var unlock = document.getElementById('unlock');
  var msg = document.getElementById('code-msg');
  var startBtn = document.getElementById('start');
  var stepCode = document.getElementById('step-code');
  var stepPid = document.getElementById('step-pid');
  var pidForm = document.getElementById('pid-form');
  var pidInput = document.getElementById('pid');
  var pidMsg = document.getElementById('pid-msg');

  input.focus();

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var entered = input.value.trim().toLowerCase();

    if (!Object.prototype.hasOwnProperty.call(CODES, entered)) {
      order = null;
      startBtn.disabled = true;
      msg.className = 'err';
      msg.textContent = entered ? 'Unrecognized code.' : 'Please enter the experimenter code.';
      input.select();
      return;
    }

    order = CODES[entered];
    msg.className = 'ok';
    // Deliberately neutral: the message must not reveal the task order to the participant.
    msg.textContent = 'Code accepted.';
    input.value = '';
    input.disabled = true;
    unlock.disabled = true;
    // Step 2: collect the participant ID. Launch stays locked until it is confirmed.
    stepCode.style.display = 'none';
    stepPid.style.display = 'block';
    pidInput.focus();
  });

  pidForm.addEventListener('submit', function(e) {
    e.preventDefault();
    var entered = pidInput.value.trim();

    if (!entered) {
      pidMsg.className = 'err';
      pidMsg.textContent = 'Please enter a participant ID.';
      pidInput.focus();
      return;
    }
    // Keep IDs to characters that stay intact in a CSV column and a file name.
    if (!/^[A-Za-z0-9 ._-]+$/.test(entered)) {
      pidMsg.className = 'err';
      pidMsg.textContent = 'Use letters, numbers, spaces, dots, hyphens or underscores only.';
      pidInput.select();
      return;
    }

    participantId = entered;
    // Stashed so the second game still has the ID even if the URL is stripped.
    try { localStorage.setItem('cct_pid', participantId); } catch (err) {}
    pidMsg.className = 'ok';
    pidMsg.textContent = 'Participant ID recorded: ' + participantId;
    startBtn.disabled = false;
    startBtn.focus();
  });

  // Editing the field after confirming re-locks Launch, so the ID that gets recorded
  // is always the one shown as confirmed.
  pidInput.addEventListener('input', function() {
    if (participantId !== null && pidInput.value.trim() !== participantId) {
      participantId = null;
      startBtn.disabled = true;
      pidMsg.className = '';
      pidMsg.textContent = '';
    }
  });

  window.addEventListener('message', function(e) {
    if (e.data === 'exp_done') finishExperiment();
  });

  startBtn.addEventListener('click', function() {
    // Defensive: the button is disabled until both steps are complete.
    if (!order || !participantId) return;
    var orderStr = order.join(',');
    var firstUrl = 'task-' + order[0] + '/index.html?s=' + encodeURIComponent(orderStr) + '&i=0'
        + '&cct_pid=' + encodeURIComponent(participantId);
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
    if (req) {
      try { req.call(el); } catch (e) {}
    }
    document.getElementById('intro').style.display = 'none';
    var iframe = document.createElement('iframe');
    iframe.id = 'exp';
    iframe.allow = 'fullscreen';
    iframe.allowFullscreen = true;
    iframe.src = firstUrl;
    document.body.appendChild(iframe);
  });
})();
</script>
</body>
</html>
